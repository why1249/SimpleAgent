<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Agent</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/highlight-light.css">
</head>
<body>
  <div id="app">
    <!-- 顶部工业极简 TUI 状态栏 -->
    <header class="status-bar">
      <div class="status-bar-left">
        <span class="brand-name">simple-agent</span>
        <span class="bar-sep"></span>
        <span id="badge-cwd" class="meta-cwd" title="当前工作目录">~</span>
        <span class="bar-sep"></span>
        <button id="badge-model" class="meta-model-btn" type="button" title="切换模型与服务配置 (Ctrl+,)">
          <span class="meta-key">model:</span>
          <span id="badge-model-val" class="meta-val">...</span>
        </button>
      </div>
      <div class="status-bar-right">
        <div id="status-pill" class="status-readout">
          <span id="status-glyph" class="status-glyph">▪</span>
          <span id="status-text">idle</span>
        </div>
        <span class="bar-sep"></span>
        <button id="btn-settings" class="icon-btn" type="button" title="服务配置 (Ctrl+,)" aria-label="打开设置">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35">
            <line x1="2" y1="4.5" x2="14" y2="4.5"></line>
            <rect x="9" y="2.5" width="2.6" height="4" fill="var(--bg-surface)"></rect>
            <line x1="2" y1="11.5" x2="14" y2="11.5"></line>
            <rect x="4.4" y="9.5" width="2.6" height="4" fill="var(--bg-surface)"></rect>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主对话滚动区 -->
    <main id="chat-container" class="chat-container">
      <!-- 终端风格启动规格面板（无对话时显示） -->
      <div id="empty-state" class="empty-state">
        <div class="spec-header">
          <span class="spec-title">simple-agent</span>
          <span class="spec-version">v0.1.2</span>
        </div>

        <div class="spec-section">
          <div class="spec-row">
            <span class="spec-key">workspace</span>
            <span id="empty-cwd" class="spec-val">~</span>
          </div>
          <div class="spec-row">
            <span class="spec-key">model</span>
            <button id="empty-model" class="spec-val spec-val-btn" type="button" title="点击修改配置">...</button>
          </div>
          <div class="spec-row">
            <span class="spec-key">tools</span>
            <span id="empty-tools" class="spec-val spec-val-muted">read_file · write_file · edit · shell</span>
          </div>
        </div>

        <div class="spec-section spec-commands">
          <button class="spec-cmd-row" type="button" data-cmd="/new">
            <span class="spec-key">/new</span>
            <span class="spec-desc">归档当前进度并开启新会话</span>
          </button>
          <button class="spec-cmd-row" type="button" data-cmd="/clear">
            <span class="spec-key">/clear</span>
            <span class="spec-desc">清空当前屏幕视图</span>
            <kbd class="spec-kbd">Ctrl+L</kbd>
          </button>
          <button class="spec-cmd-row" type="button" data-open-settings="true">
            <span class="spec-key">config</span>
            <span class="spec-desc">模型、API Key 与推理强度配置</span>
            <kbd class="spec-kbd">Ctrl+,</kbd>
          </button>
          <div class="spec-cmd-row is-static">
            <span class="spec-key">history</span>
            <span class="spec-desc">回溯上一条/下一条历史输入</span>
            <kbd class="spec-kbd">↑ / ↓</kbd>
          </div>
        </div>
      </div>

      <div id="messages" class="messages-list"></div>
    </main>

    <!-- 底部居中限宽命令行输入区 -->
    <footer class="input-dock">
      <div class="input-dock-inner">
        <!-- 斜杠命令补全浮层 -->
        <div id="slash-menu" class="slash-menu hidden" role="listbox" aria-label="斜杠命令">
          <div class="slash-menu-header">
            <span>COMMANDS</span>
            <span>↑/↓ 选择 · Tab 补全 · Enter 执行</span>
          </div>
          <div id="slash-menu-list" class="slash-menu-list"></div>
        </div>

        <div id="input-box" class="input-box">
          <span class="input-prompt-symbol">›</span>
          <textarea
            id="prompt-input"
            class="prompt-input"
            placeholder="输入指令，或输入 / 调用命令"
            rows="1"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button id="send-btn" class="send-btn" type="button" title="发送 (Enter)">↵</button>
        </div>

        <div class="input-hints">
          <span>Enter 发送 · Shift+Enter 换行</span>
          <span>/ 命令 · Ctrl+L 清屏</span>
        </div>
      </div>
    </footer>

    <!-- 服务配置模态框 -->
    <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">SERVICE CONFIG</h3>
          <button id="btn-close-modal" class="icon-btn" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="form-item">
            <label for="cfg-api-key">API Key <span class="required">*</span></label>
            <input type="password" id="cfg-api-key" placeholder="sk-..." autocomplete="off" />
          </div>
          <div class="form-item">
            <label for="cfg-base-url">Base URL</label>
            <input type="text" id="cfg-base-url" placeholder="https://api.deepseek.com/v1" />
          </div>
          <div class="form-item">
            <label for="cfg-model">Model</label>
            <input type="text" id="cfg-model" placeholder="deepseek-chat" />
          </div>
          <div class="form-item">
            <label for="cfg-reasoning">Reasoning Effort</label>
            <input type="text" id="cfg-reasoning" placeholder="default / low / medium / high" />
          </div>
          <div id="modal-feedback" class="modal-feedback hidden"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-cancel-config" class="btn btn-secondary" type="button">取消</button>
          <button id="btn-save-config" class="btn btn-primary" type="button">保存生效</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 第三方静态库 -->
  <script defer src="static/marked.min.js"></script>
  <script defer src="static/highlight.min.js"></script>

  <!-- 模块化前端脚本（按依赖顺序加载，兼容 file:// 协议） -->
  <script defer src="js/state.js"></script>
  <script defer src="js/utils/dom.js"></script>
  <script defer src="js/utils/markdown.js"></script>
  <script defer src="js/bridge.js"></script>
  <script defer src="js/components/status_bar.js"></script>
  <script defer src="js/components/tool_step.js"></script>
  <script defer src="js/components/chat_view.js"></script>
  <script defer src="js/components/slash_menu.js"></script>
  <script defer src="js/components/input_bar.js"></script>
  <script defer src="js/components/settings_modal.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
